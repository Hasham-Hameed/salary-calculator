<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-label">PAYROLL / MONTHLY</div>

  <div class="payslip">
    <div class="slip-header">
      <div class="slip-header-left">
        <h1>SALARY CALCULATOR</h1>
        <p>basic + house allowance + medical allowance</p>
      </div>
      <div class="slip-id">
        <span>SLIP NO.</span>
        <strong id="slipNo">000001</strong>
      </div>
    </div>

    <hr class="divider">

    <div class="inputs">
      <div class="field">
        <label for="basicSalary">Basic salary</label>
        <input id="basicSalary" type="number" inputmode="decimal" placeholder="0.00" step="0.01" min="0">
      </div>

      <div class="field">
        <label for="houseAllowance">House allowance <span class="unit">%</span></label>
        <input id="houseAllowance" type="number" inputmode="decimal" placeholder="0" step="0.1" min="0">
      </div>

      <div class="field">
        <label for="medicalAllowance">Medical allowance <span class="unit">%</span></label>
        <input id="medicalAllowance" type="number" inputmode="decimal" placeholder="0" step="0.1" min="0">
      </div>
    </div>

    <hr class="divider">

    <table class="breakdown">
      <thead>
        <tr>
          <th>Earnings</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Basic salary</td>
          <td id="outBasic">0.00</td>
        </tr>
        <tr>
          <td>House allowance</td>
          <td id="outHouse">0.00</td>
        </tr>
        <tr>
          <td>Medical allowance</td>
          <td id="outMedical">0.00</td>
        </tr>
      </tbody>
    </table>

    <div class="gross">
      <span class="label">GROSS SALARY</span>
      <span class="value" id="outGross">0.00</span>
    </div>

    <div class="slip-footer">
      This is a computer-generated estimate — not an official payslip.
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
